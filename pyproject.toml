[project]
name = "relmap"
version = "0.0.5"
description = "Navegación relativista y mapa del espacio-tiempo (experimental)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "plotly", "pyyaml"]
license = "AGPL-3.0-or-later"
authors = [{ name = "Pedro Sordo Martínez" }]

[project.scripts]
relmap = "relmap.cli:main"
relmap-solar = "relmap.solar_cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
